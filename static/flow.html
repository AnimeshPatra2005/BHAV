<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhav &middot; flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FDF0E0; --pencil:#2B1A0F; --accent:#D45F20; }
  * { box-sizing: border-box; }
  body { margin:0; background:#1A100A; display:grid; place-items:center;
         min-height:100vh; font-family:"Baloo 2",system-ui,sans-serif; gap:16px;
         padding:20px; }
  .stage { width:min(96vw, 1600px); aspect-ratio:16/9; background:var(--paper);
           border-radius:10px; overflow:hidden; position:relative;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  svg { width:100%; height:100%; display:block; }
  .bar { display:flex; gap:10px; align-items:center; }
  button { font-family:inherit; font-weight:700; font-size:15px; padding:11px 22px;
           border-radius:999px; border:none; cursor:pointer;
           background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:#C9A98C; box-shadow:inset 0 0 0 2px #4A3524; }
  .hint { color:#8A7260; font-size:13px; }

  /* ---- the drawing engine ----
     pathLength="1" normalises every path, so one dasharray value draws any
     shape correctly regardless of its real length. */
  .d { stroke-dasharray:1; stroke-dashoffset:1;
       animation:draw var(--t,.5s) ease-out var(--d,0s) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  /* text reveals left-to-right, as if being written */
  .w { clip-path:inset(0 100% 0 0);
       animation:write var(--t,.45s) ease-out var(--d,0s) forwards; }
  @keyframes write { to { clip-path:inset(0 -2% 0 0); } }

  .p { opacity:0; transform-box:fill-box; transform-origin:center;
       animation:pop .32s cubic-bezier(.34,1.56,.64,1) var(--d,0s) forwards; }
  @keyframes pop { from{opacity:0;transform:scale(.4)} to{opacity:1;transform:scale(1)} }

  .flash { opacity:0; animation:flash .7s ease-out var(--d,0s) forwards; }
  @keyframes flash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }

  #diagram { animation:dim .7s ease-in 8.6s forwards; }
  @keyframes dim { to { opacity:.08; } }

  #finale { opacity:0; animation:rise .9s cubic-bezier(.2,.8,.2,1) 8.9s forwards; }
  @keyframes rise { from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:none} }

  .ink  { fill:none; stroke:var(--pencil); stroke-width:3.4;
          stroke-linecap:round; stroke-linejoin:round; }
  .thin { stroke-width:2.4; }
  .acc  { stroke:var(--accent); }
  text  { font-family:"Caveat",cursive; fill:var(--pencil); }
  .lbl  { font-size:30px; font-weight:600; }
  .big  { font-size:44px; font-weight:700; }
  .cap  { font-size:24px; font-weight:500; opacity:.62; }
</style>
</head>
<body>
<div class="stage" id="stage">
<svg id="svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- gives every stroke an organic, slightly shaky pencil wobble -->
    <filter id="pencil" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#FDF0E0"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".055"/>

  <g id="diagram" filter="url(#pencil)">

    <!-- ============ 1. the photo (0.0 - 1.5s) ============ -->
    <path class="ink d" style="--d:0s;--t:.55s" pathLength="1"
          d="M104 250 q0-16 16-16 h150 q16 0 16 16 v300 q0 16-16 16 h-150 q-16 0-16-16 z"/>
    <path class="ink thin d" style="--d:.42s;--t:.3s" pathLength="1"
          d="M122 278 h146 v244 h-146 z"/>
    <path class="ink thin d" style="--d:.7s;--t:.32s" pathLength="1"
          d="M166 348 h58 v128 h-58 z M178 338 h34 v10 h-34 z"/>
    <path class="ink thin acc d" style="--d:.9s;--t:.25s" pathLength="1"
          d="M196 372 l-14 32 h20 l-12 30"/>
    <g class="d ink thin acc" style="--d:1.0s;--t:.25s">
      <path pathLength="1" d="M292 232 l26-20 M300 258 l32-6 M282 208 l10-30"/>
    </g>
    <text class="lbl w" style="--d:1.1s" x="112" y="612">photograph it</text>

    <!-- ============ 2. the agent (1.5 - 3.0s) ============ -->
    <path class="ink d" style="--d:1.5s;--t:.35s" pathLength="1" d="M300 400 h100"/>
    <path class="ink d" style="--d:1.76s;--t:.14s" pathLength="1"
          d="M384 386 l18 14 l-18 14"/>
    <path class="ink d" style="--d:1.85s;--t:.5s" pathLength="1"
          d="M424 334 q0-18 18-18 h404 q18 0 18 18 v96 q0 18-18 18 h-404 q-18 0-18-18 z"/>
    <path class="ink acc flash" style="--d:2.75s" stroke-width="5"
          d="M424 334 q0-18 18-18 h404 q18 0 18 18 v96 q0 18-18 18 h-404 q-18 0-18-18 z"
          fill="none"/>
    <text class="cap w" style="--d:2.05s" x="424" y="296">the agent</text>
    <text class="big w" style="--d:2.25s;--t:.55s" x="452" y="396">Strands Agents SDK</text>

    <!-- ============ 3. the tools (3.0 - 6.5s) ============ -->
    <path class="ink thin d" style="--d:3.0s;--t:.22s" pathLength="1" d="M644 450 v70"/>
    <path class="ink thin d" style="--d:3.2s;--t:.4s"  pathLength="1" d="M470 520 h348"/>

    <!-- identify -->
    <path class="ink thin d" style="--d:3.58s;--t:.2s" pathLength="1" d="M470 520 v40"/>
    <path class="ink d" style="--d:3.68s;--t:.3s" pathLength="1"
          d="M404 560 h132 v76 h-132 z"/>
    <text class="lbl w" style="--d:3.86s;--t:.3s" x="422" y="608">identify</text>
    <path class="ink acc thin d" style="--d:4.06s;--t:.2s" pathLength="1" d="M548 596 l12 12 l22-26"/>

    <!-- route -->
    <path class="ink thin d" style="--d:4.10s;--t:.2s" pathLength="1" d="M644 520 v40"/>
    <path class="ink d" style="--d:4.20s;--t:.3s" pathLength="1"
          d="M588 560 h112 v76 h-112 z"/>
    <text class="lbl w" style="--d:4.38s;--t:.3s" x="608" y="608">route</text>
    <path class="ink acc thin d" style="--d:4.58s;--t:.2s" pathLength="1" d="M712 596 l12 12 l22-26"/>

    <!-- value -->
    <path class="ink thin d" style="--d:4.62s;--t:.2s" pathLength="1" d="M818 520 v40"/>
    <path class="ink d" style="--d:4.72s;--t:.3s" pathLength="1"
          d="M752 560 h132 v76 h-132 z"/>
    <text class="lbl w" style="--d:4.90s;--t:.3s" x="776" y="608">value</text>
    <path class="ink acc thin d" style="--d:5.10s;--t:.2s" pathLength="1" d="M896 596 l12 12 l22-26"/>

    <!-- facility -->
    <path class="ink thin d" style="--d:5.14s;--t:.2s" pathLength="1" d="M818 520 h174 v40"/>
    <path class="ink d" style="--d:5.24s;--t:.3s" pathLength="1"
          d="M936 560 h150 v76 h-150 z"/>
    <text class="lbl w" style="--d:5.42s;--t:.3s" x="954" y="608">facility</text>
    <path class="ink acc thin d" style="--d:5.62s;--t:.2s" pathLength="1" d="M1098 596 l12 12 l22-26"/>

    <!-- reuse -->
    <path class="ink thin d" style="--d:5.66s;--t:.2s" pathLength="1" d="M992 520 h186 v40"/>
    <path class="ink d" style="--d:5.76s;--t:.3s" pathLength="1"
          d="M1122 560 h126 v76 h-126 z"/>
    <text class="lbl w" style="--d:5.94s;--t:.3s" x="1142" y="608">reuse</text>
    <path class="ink acc thin d" style="--d:6.14s;--t:.2s" pathLength="1" d="M1260 596 l12 12 l22-26"/>

    <!-- the loop back into the agent -->
    <path class="ink thin d" style="--d:6.10s;--t:.4s" pathLength="1"
          d="M396 598 q-78 0 -78 -92 q0 -62 100 -62"/>
    <path class="ink thin d" style="--d:6.42s;--t:.14s" pathLength="1"
          d="M404 430 l16 14 l-16 14"/>
    <text class="cap w" style="--d:6.26s;--t:.3s" x="318" y="664">loops</text>

    <!-- ============ 4. the answer (6.5 - 8.5s) ============ -->
    <path class="ink d" style="--d:6.5s;--t:.4s" pathLength="1" d="M874 382 h352"/>
    <path class="ink d" style="--d:6.8s;--t:.14s" pathLength="1"
          d="M1212 368 l18 14 l-18 14"/>
    <text class="cap w" style="--d:6.62s;--t:.3s" x="972" y="356">answer</text>

    <path class="ink d" style="--d:6.9s;--t:.55s" pathLength="1"
          d="M1252 206 q0-18 18-18 h242 q18 0 18 18 v446 q0 18-18 18 h-242 q-18 0-18-18 z"/>
    <text class="w" style="--d:7.4s;--t:.4s;font-size:118px;font-weight:700"
          x="1300" y="400">&#8377;0</text>
    <text class="w" style="--d:7.82s;--t:.45s;font-size:40px;font-weight:700"
          x="1286" y="498">DO NOT BIN</text>
    <path class="ink acc d" style="--d:8.2s;--t:.22s" pathLength="1"
          d="M1286 518 h212 M1290 532 h198"/>
  </g>

  <!-- ============ 5. the sign-off (8.9 - 10.0s) ============ -->
  <g id="finale">
    <text x="800" y="438" text-anchor="middle"
          style="font-family:'Baloo 2';font-weight:800;font-size:184px;fill:#2B1A0F">bhav</text>
    <g transform="translate(713,466) scale(1.45)">
      <path d="M26 34h68l-7 102a9 9 0 0 1-9 8H42a9 9 0 0 1-9-8z" fill="#D45F20"/>
      <g stroke="#FDF0E0" stroke-width="5" stroke-linecap="round">
        <line x1="47" y1="54" x2="47" y2="124"/>
        <line x1="60" y1="54" x2="60" y2="124"/>
        <line x1="73" y1="54" x2="73" y2="124"/>
      </g>
      <rect x="16" y="14" width="88" height="14" rx="7" fill="#D45F20"/>
      <rect x="46" y="2" width="28" height="9" rx="4.5" fill="none"
            stroke="#D45F20" stroke-width="7"/>
    </g>
  </g>
</svg>
</div>

<div class="bar">
  <button id="replay">Replay</button>
  <button class="ghost" id="loop">Loop: off</button>
  <span class="hint">10.0s &middot; record the panel above</span>
</div>

<script>
const stage = document.getElementById("stage");
const svg = document.getElementById("svg");
let looping = false, timer = null;

function play() {
  // Cloning restarts every CSS animation at once, which is far more reliable
  // than resetting animation-name on a few dozen nodes.
  const fresh = svg.cloneNode(true);
  svg.replaceWith(fresh);
  window.svgRef = fresh;
  clearTimeout(timer);
  if (looping) timer = setTimeout(() => { bind(); play(); }, 10400);
}
function bind() { window.svgRef = document.getElementById("svg") || window.svgRef; }

document.getElementById("replay").onclick = () => {
  const cur = stage.querySelector("svg");
  const fresh = cur.cloneNode(true);
  cur.replaceWith(fresh);
  clearTimeout(timer);
  if (looping) timer = setTimeout(replayLoop, 10400);
};
function replayLoop() {
  const cur = stage.querySelector("svg");
  const fresh = cur.cloneNode(true);
  cur.replaceWith(fresh);
  if (looping) timer = setTimeout(replayLoop, 10400);
}
document.getElementById("loop").onclick = (e) => {
  looping = !looping;
  e.target.textContent = "Loop: " + (looping ? "on" : "off");
  clearTimeout(timer);
  if (looping) timer = setTimeout(replayLoop, 10400);
};
</script>
</body>
</html>
